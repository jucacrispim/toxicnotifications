language: python
docker: true

versions:
  - '3.11'
  - '3.12'
  - '3.13'

extra_indexes:
  - 'https://pypi.poraodojuca.dev'


branches:
  - master

system_packages:
  - make

steps:
  - name: setup db
    command: ./scripts/env.sh

  - name: Linter checks
    command: ./scripts/run_linter.sh
    stop_on_fail: true

  - name: Code complexity checks
    command: xenon toxicbuild -b B
    warning_on_fail: true

  - name: Unit tests & coverage
    command: ./scripts/check_coverage.sh
    stop_on_fail: true

  - name: Functional tests
    command: pytest tests/functional
    stop_on_fail: true



builders:
  - name: Docs & Release
    branches:
      - release

    platform: python3.13

    envvars:
      ENV: ci

    plugins:
      - name: apt-install
        packages:
          - build-essential
          - curl

      - name: python-venv
        pyversion: python3.13
        extra_indexes:
          - 'https://pypi.poraodojuca.dev'

    steps:
      - name: Build docs
        command: ./scripts/build_docs.sh
        stop_on_fail: true

      - name: upload docs to pdj pypi
        command: ./scripts/release.sh

      - name: upload docs
        command: ./scripts/upload_docs.sh
